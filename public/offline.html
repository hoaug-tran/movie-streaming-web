<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Không có kết nối - Gió Phim</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #0c0c0c;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .icon {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        opacity: 0.6;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 12px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 0.95rem;
        color: #8a8a8a;
        line-height: 1.6;
        max-width: 320px;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        padding: 12px 28px;
        background: #c8102e;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        margin: 6px;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #a00b24;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #f0f0f0;
      }
      .btn-outline:hover {
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#C8102E" stroke-width="1.5">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.83M9.363 5.365A9.466 9.466 0 0112 5c4.478 0 8.268 2.943 9.543 7a9.516 9.516 0 01-1.84 3.374M6.228 6.228A9.516 9.516 0 002.457 12c1.274 4.057 5.065 7 9.543 7 1.902 0 3.68-.516 5.21-1.42"
      />
    </svg>
    <h1>Không có kết nối mạng</h1>
    <p>Bạn đang offline. Hãy kiểm tra kết nối internet hoặc xem các phim đã tải về.</p>
    <div>
      <a href="/downloads" class="btn">Phim đã tải</a>
      <a href="/" class="btn btn-outline" onclick="window.location.reload()">Thử lại</a>
    </div>
  </body>
</html>
